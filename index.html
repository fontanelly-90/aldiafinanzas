<style>
/* Layout: una sola columna tipo libreta de banco; héroe con "lo que puedes gastar hoy", luego pagos como renglones con barra de avance. Navegación inferior fija. */
:root{
  --bg:#EEF2EF; --surface:#FFFFFF; --sunk:#E3E9E5; --line:#CFD8D2;
  --fg:#14201B; --muted:#5B6B63;
  --accent:#0E7A5C; --accent-ink:#FFFFFF; --accent-soft:#D3EEE3;
  --ok:#1C7C4A; --ok-soft:#DCF1E4; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B4321C; --bad-soft:#F8DDD6;
  --hero:#123B30; --hero-fg:#EAF6F0; --hero-muted:#9FC4B5;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Figtree", system-ui, -apple-system, sans-serif;
  --f-mono:"DM Mono", ui-monospace, Menlo, monospace;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0D1412; --surface:#151F1C; --sunk:#1C2925; --line:#2A3A35;
  --fg:#E6EFEB; --muted:#93A69E;
  --accent:#3FD3A2; --accent-ink:#06231A; --accent-soft:#163A2F;
  --ok:#5BD08F; --ok-soft:#173527; --warn:#F2B451; --warn-soft:#3A2C12; --bad:#FF8A72; --bad-soft:#3F1E17;
  --hero:#0F2F26; --hero-fg:#EAF6F0; --hero-muted:#86B3A2; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0D1412; --surface:#151F1C; --sunk:#1C2925; --line:#2A3A35;
  --fg:#E6EFEB; --muted:#93A69E;
  --accent:#3FD3A2; --accent-ink:#06231A; --accent-soft:#163A2F;
  --ok:#5BD08F; --ok-soft:#173527; --warn:#F2B451; --warn-soft:#3A2C12; --bad:#FF8A72; --bad-soft:#3F1E17;
  --hero:#0F2F26; --hero-fg:#EAF6F0; --hero-muted:#86B3A2; color-scheme:dark}
*{box-sizing:border-box}
html,body{overflow-x:hidden;overflow-x:clip;overscroll-behavior-x:none;max-width:100%}
.wrap,.sheet{overflow-x:hidden}
.x-del{border:0;background:transparent;color:var(--muted);width:32px;height:32px;border-radius:50%;font-size:1.1rem;flex:none}
.x-del:hover,.x-del:focus-visible{background:var(--bad-soft);color:var(--bad)}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:640px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.15rem;font-weight:700}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.eyebrow{font-size:.72rem;text-transform:uppercase;letter-spacing:.09em;font-weight:600;color:var(--muted)}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.logo{width:40px;height:40px;border-radius:10px;display:block;flex:none}
.brand h1{font-size:1.5rem;font-weight:800}
.save{font-size:.75rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.save i{width:7px;height:7px;border-radius:50%;background:var(--muted);display:inline-block}
.save.cloud i{background:var(--ok)}
/* hero */
.hero{background:var(--hero);color:var(--hero-fg);border-radius:20px;padding:22px 20px;display:flex;flex-direction:column;gap:14px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;right:-40px;top:-40px;width:180px;height:180px;border-radius:50%;
  background:repeating-radial-gradient(circle,transparent 0 10px,rgba(255,255,255,.05) 10px 11px)}
.hero .eyebrow{color:var(--hero-muted)}
.big{font-family:var(--f-display);font-weight:800;font-size:clamp(2.6rem,11vw,3.6rem);line-height:1;letter-spacing:-.03em}
.big small{font-size:.4em;font-weight:500;color:var(--hero-muted);margin-left:4px}
.hero p{margin:0;color:var(--hero-muted);font-size:.92rem}
.hero p b{color:var(--hero-fg);font-weight:600}
.hero .row{display:flex;gap:8px;flex-wrap:wrap;position:relative;z-index:1}
/* buttons */
button{font:inherit;cursor:pointer}
.btn{border:0;border-radius:999px;padding:10px 16px;font-weight:600;background:var(--accent);color:var(--accent-ink)}
.btn.ghost{background:transparent;color:var(--fg);border:1px solid var(--line)}
.hero .btn.ghost{color:var(--hero-fg);border-color:rgba(255,255,255,.25)}
.btn.sm{padding:6px 12px;font-size:.85rem}
.btn.danger{background:var(--bad-soft);color:var(--bad)}
.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* stats */
.stats{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.stat{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:13px 16px;border-top:1px solid var(--line)}
.stat:first-child{border-top:0}
.stat .lbl{font-size:.92rem;color:var(--muted)}
.stat .num{font-size:1.1rem;font-weight:500;white-space:nowrap}
.stat.prog{flex-direction:column;align-items:stretch;gap:8px}
.stat.prog .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* goal strip */
.goal{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:14px 16px;border-radius:var(--r);background:var(--accent-soft)}
.goal .num{font-size:1.2rem;font-weight:500;color:var(--accent)}
.goal p{margin:0;font-size:.85rem;color:var(--muted)}
/* section */
.sec{display:flex;flex-direction:column;gap:10px}
.sec-h{display:flex;justify-content:space-between;align-items:center;gap:10px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.item{padding:14px 16px;display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line)}
.item:first-child{border-top:0}
.item-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.item-name{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item-sub{font-size:.8rem;color:var(--muted)}
.item-amt{text-align:right;white-space:nowrap}
.item-amt .num{font-weight:500}
.bar{height:8px;background:var(--sunk);border-radius:99px;overflow:hidden}
.bar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.bar.ok span{background:var(--ok)}
.bar.bad span{background:var(--bad)}
.chip{display:inline-flex;align-items:center;gap:5px;font-size:.72rem;font-weight:600;padding:3px 8px;border-radius:99px;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-ok{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-go{background:var(--accent-soft);color:var(--accent)}
.c-mute{background:var(--sunk);color:var(--muted)}
.meta{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;font-size:.8rem;color:var(--muted)}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--fg)}
.banner{padding:10px 14px;border-radius:12px;background:var(--warn-soft);color:var(--warn);font-size:.85rem;display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap}
.alloc{display:flex;flex-wrap:wrap;gap:6px}
.alloc span{font-size:.75rem;background:var(--sunk);padding:3px 8px;border-radius:8px}
/* forms */
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:.8rem;font-weight:600;color:var(--muted)}
input,select{font:inherit;font-size:16px;color:var(--fg);background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;min-width:0;min-height:46px;display:block}
input[type=date]{-webkit-appearance:none;appearance:none;text-align:left}
input[type=date]::-webkit-date-and-time-value{text-align:left}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.two>*{min-width:0}
.check{display:flex;align-items:center;gap:8px;font-size:.9rem}
.check input{width:18px;height:18px}
/* preview table */
.pv{display:flex;flex-direction:column;gap:8px}
.pv-row{display:grid;grid-template-columns:1fr 120px;gap:10px;align-items:center}
.pv-row .item-sub{display:block}
.pv-row input{text-align:right;font-family:var(--f-mono)}
.pv-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px dashed var(--line);font-weight:600}
.note{font-size:.85rem;padding:10px 12px;border-radius:10px}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.ok{background:var(--ok-soft);color:var(--ok)}
/* nav */
nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);
  padding:8px max(16px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
nav .in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.seg{display:flex;background:var(--sunk);border-radius:999px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;padding:8px 6px;border-radius:999px;color:var(--muted);font-weight:600;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.total{display:flex;flex-direction:column;gap:4px;padding:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r)}
.total .num{font-size:1.9rem;font-weight:500}
.total p{margin:0;font-size:.88rem;color:var(--muted)}
.total p b{color:var(--fg)}
.crow{display:flex;flex-direction:column;gap:7px;padding:12px 16px;border-top:1px solid var(--line)}
.crow:first-child{border-top:0}
.crow .top-r{display:flex;justify-content:space-between;gap:10px;align-items:baseline}
.crow .pct{color:var(--muted);font-size:.8rem;margin-left:6px}
.crow.lead .bar span{background:var(--warn)}
.cat-chip{font-size:.72rem;font-weight:600;color:var(--accent);background:var(--accent-soft);padding:2px 8px;border-radius:99px;white-space:nowrap}
.tab{border:0;background:transparent;color:var(--muted);padding:9px 6px;border-radius:12px;font-weight:600;font-size:.88rem}
.tab[aria-selected="true"]{background:var(--accent-soft);color:var(--accent)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(5,15,12,.55);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:640px;max-height:90vh;overflow:auto;border-radius:20px 20px 0 0;
  padding:20px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px}
.sheet-h{display:flex;justify-content:space-between;align-items:center}
.x{border:0;background:var(--sunk);color:var(--fg);width:32px;height:32px;border-radius:50%;font-size:1.1rem}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.88rem;z-index:40;max-width:calc(100% - 32px)}
.toast-undo{border:0;background:transparent;color:var(--accent);font-weight:700;margin-left:8px;cursor:pointer;font-size:.88rem}
.item.paid .item-name,.item.paid .item-amt .num{text-decoration:line-through;opacity:.6}
.trow.done span{text-decoration:line-through;opacity:.55}
.trow .ok-mark{color:var(--ok);font-weight:700;margin-right:4px;text-decoration:none!important}
/* guerra: plan de pagos e ingresos esperados día por día */
nav .in{grid-template-columns:1fr 1fr 1.35fr 1fr 1fr}
.tab{font-size:.74rem;padding:9px 1px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tcg-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.tcg{position:relative;display:flex;flex-direction:column;gap:8px;padding:12px;border-radius:16px;background:var(--surface);border:2px solid var(--line);box-shadow:0 2px 0 var(--line);min-width:0}
.tcg-bad{border-color:var(--bad);background:linear-gradient(180deg,var(--bad-soft),var(--surface) 45%)}
.tcg-warn{border-color:var(--warn);background:linear-gradient(180deg,var(--warn-soft),var(--surface) 45%)}
.tcg-go{border-color:var(--accent);background:linear-gradient(180deg,var(--accent-soft),var(--surface) 45%)}
.tcg-done .tcg-amt{color:var(--ok)}
.tcg-top{display:flex;justify-content:space-between;align-items:center;gap:6px}
.tcg-n{font-family:var(--f-mono);font-size:.75rem;color:var(--muted)}
.tcg-name{font-size:1rem;line-height:1.2;overflow-wrap:anywhere;min-height:2.4em}
.tcg-amt{font-size:1.35rem;font-weight:500}
.tcg-stats{margin:0;display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--sunk);border-radius:10px;padding:8px}
.tcg-stats dt{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tcg-stats dd{margin:0;font-size:.78rem;font-weight:600;overflow-wrap:anywhere}
.tcg-hp{height:10px;border-radius:99px;background:var(--sunk);overflow:hidden;border:1px solid var(--line)}
.tcg-hp span{display:block;height:100%;background:var(--ok);transition:width .4s}
.tcg-foot{font-size:.8rem;color:var(--muted);min-height:2.2em}
.tcg-ok{color:var(--ok);font-weight:700}
.tcg-edit{align-self:flex-start}
.tcg-dead{border-color:var(--ok);background:var(--sunk);filter:grayscale(.6)}
.tcg-dead .tcg-name,.tcg-dead .tcg-amt{text-decoration:line-through;opacity:.7}
.tcg-stamp{position:absolute;top:66%;left:50%;transform:translate(-50%,-50%) rotate(-14deg);border:3px solid var(--ok);color:var(--ok);font-family:var(--f-display);font-weight:800;font-size:1.3rem;letter-spacing:.12em;padding:2px 10px;border-radius:8px;background:color-mix(in srgb,var(--surface) 70%,transparent);pointer-events:none}
.sum-h{cursor:pointer;font-family:var(--f-display);font-weight:700;font-size:1.15rem;padding:4px 0}
details.sec{display:block}
.tab{font-size:.8rem;padding:9px 2px}
.hero .gbar{height:10px;background:rgba(255,255,255,.16);border-radius:99px;overflow:hidden;position:relative;z-index:1}
.hero .gbar span{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.stat .lbl b{color:var(--fg);font-weight:600}
.orders{margin:0;padding:14px 16px 14px 34px;display:flex;flex-direction:column;gap:8px;font-size:.92rem}
.orders b{font-weight:600}
.ai-out{white-space:pre-wrap;font-size:.9rem;padding:12px 16px;border-top:1px solid var(--line)}
.board{display:flex;flex-direction:column;gap:12px}
.sq{display:grid;grid-template-columns:52px minmax(0,1fr);gap:10px;align-items:start}
.tile{width:52px;height:56px;border-radius:12px;background:var(--surface);border:1.5px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.05}
.tile b{font-family:var(--f-display);font-size:1.35rem;font-weight:800}
.tile small{font-size:.62rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.sq.today .tile{background:var(--hero);border-color:var(--hero);color:var(--hero-fg)}
.sq.today .tile small{color:var(--hero-muted)}
.sq.neg .tile{border-color:var(--bad)}
.sq .list{padding:4px 14px}
.sq-h{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:8px 0 6px;font-size:.78rem;color:var(--muted);font-weight:600}
.trow{display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:6px 0;border-top:1px solid var(--line);font-size:.9rem}
.trow span:first-child{min-width:0;overflow-wrap:anywhere}
.trow .num{white-space:nowrap}
.trow.res{color:var(--muted);font-style:italic}
.amt-in{color:var(--ok)}
.late{font-size:.72rem;color:var(--warn);font-weight:600;margin-left:4px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

function siguiente(fecha, rec){
  if(rec==="semanal") return addDays(fecha,7);
  if(rec==="catorcenal") return addDays(fecha,14);
  if(rec==="quincenal") return addDays(fecha,15);
  if(rec==="bimestral") return addMonth(addMonth(fecha));
  if(rec==="anual"){let f=fecha;for(let i=0;i<12;i++)f=addMonth(f);return f;}
  return addMonth(fecha);
}

function todayStr(){const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");}
function parse(s){const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d);}
function days(a,b){return Math.round((parse(b)-parse(a))/86400000);}
function addDays(s,n){const t=new Date(parse(s)+n*86400000);return t.toISOString().slice(0,10);}
function addMonth(s){const [y,m,d]=s.split("-").map(Number);const t=new Date(Date.UTC(y,m,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10);}
const MESES=["ene","feb","mar","abr","may","jun","jul","ago","sep","oct","nov","dic"];

/* ---------- motor de cálculo ---------- */
const period = () => FREQ[S.config.frecuencia]||15;
const SUELDO_FREQ = {semanal:7, catorcenal:14, quincenal:15, mensual:30};
function fuentes(){
  if(!S.config.fuentes) S.config.fuentes={negocio:true, sueldo:{frecuencia:"catorcenal", proxima:"2026-11-04"}};
  return S.config.fuentes;
}
function avanzaSueldo(n,f){return f==="mensual"?addMonth(n):addDays(n,SUELDO_FREQ[f]||14);}
function proxSueldo(incluyeHoy){
  const s=fuentes().sueldo; if(!s||!s.frecuencia||!s.proxima) return null;
  const hoy=todayStr(); let n=s.proxima, g=0;
  while((incluyeHoy?days(hoy,n)<0:days(hoy,n)<=0) && g++<500) n=avanzaSueldo(n,s.frecuencia);
  return n;
}
function ingresosAntesDe(d){
  if(d<=0) return 1;
  const f=fuentes(); let n=0;
  if(f.negocio) n+=d;
  let p=proxSueldo(true), g=0;
  if(p){const hoy=todayStr(); while(days(hoy,p)<d && g++<500){n++; p=avanzaSueldo(p,f.sueldo.frecuencia);}}
  return Math.max(1,n);
}
const restante = p => Math.max(0, r2(p.monto - p.apartado));
const pendientes = () => S.pagos.filter(p=>!p.pagado);

function cuotaDe(p, hoy){
  const d = days(hoy, p.vence);
  const ingresosAntes = ingresosAntesDe(d);
  const estricto = S.config.estricto!==false;
  return {cuota: estricto ? restante(p) : r2(restante(p)/ingresosAntes), ingresosAntes, d};
}

function repartir(monto, hoy){
  const pend = pendientes().filter(p=>restante(p)>0).map(p=>Object.assign({p},cuotaDe(p,hoy)));
  pend.sort((a,b)=>parse(a.p.vence)-parse(b.p.vence));
  const necesario = r2(pend.reduce((s,x)=>s+x.cuota,0));
  const asig = {};
  let disp = monto;
  if(S.config.modo==="proporcional" && monto < necesario && necesario>0){
    pend.forEach(x=>{asig[x.p.id]=r2(monto*x.cuota/necesario);});
    disp = 0;
  }else{
    pend.forEach(x=>{const a=r2(Math.min(x.cuota,disp));asig[x.p.id]=a;disp=r2(disp-a);});
  }
  return {pend, asig, necesario, falta: r2(Math.max(0,necesario-monto))};
}

function proximoIngreso(){
  const ps=proxSueldo(false); if(ps) return ps;
  return addDays(todayStr(), fuentes().negocio?1:15);
}
function metricas(){
  const hoy=todayStr();
  const libre = r2(S.ingresos.reduce((s,i)=>s+i.libre,0) - S.gastos.reduce((s,g)=>s+g.monto,0));
  const prox = proximoIngreso();
  const tieneSueldo = !!proxSueldo(false);
  const dias = tieneSueldo ? Math.max(1, days(hoy,prox)) : (fuentes().negocio ? Math.max(1, +S.config.rinde||7) : 15);
  const pend = pendientes();
  const totalPend = r2(pend.reduce((s,p)=>s+p.monto,0));
  const apartado = r2(pend.reduce((s,p)=>s+p.apartado,0));
  const falta = r2(pend.reduce((s,p)=>s+restante(p),0));
  const meta = r2(pend.reduce((s,p)=>s+cuotaDe(p,hoy).cuota,0));
  const gastadoHoy = r2(S.gastos.filter(g=>g.fecha===hoy).reduce((s,g)=>s+g.monto,0));
  const estricto = S.config.estricto!==false;
  const usable = estricto ? Math.max(0, r2(libre - falta)) : libre;
  const diario = Math.max(0, r2((usable+gastadoHoy)/dias));
  const lim=addDays(hoy,30), p30=pend.filter(p=>p.vence<=lim);
  const porPagar30=r2(p30.reduce((s,p)=>s+p.monto,0)), apartado30=r2(p30.reduce((s,p)=>s+p.apartado,0)), falta30=r2(p30.reduce((s,p)=>s+restante(p),0));
  const mes=hoy.slice(0,7), pagadoMes=r2(S.pagos.filter(p=>p.pagado&&(p.pagadoEn||"").slice(0,7)===mes).reduce((s,p)=>s+p.monto,0));
  return {libre, usable, estricto, prox, dias, totalPend, apartado, falta, meta, diario, hoyRest: r2(diario-gastadoHoy), gastadoHoy, porPagar30, apartado30, falta30, pagadoMes, avance: porPagar30? apartado30/porPagar30 : 0};
}
function estado(p){
  if(p.pagado) return ["Pagado","c-mute"];
  if(restante(p)<=0) return ["Listo para pagar","c-ok"];
  const {d,ingresosAntes}=cuotaDe(p,todayStr());
  if(d<0) return ["Vencido","c-bad"];
  if(ingresosAntes<=1) return ["Urgente","c-warn"];
  return ["En camino","c-go"];
}
/* ---------- guerra: plan día por día ---------- */
const NO_PERSONAL=["Nómina MATRU","Inversión","Compra de cacao","Cuentas por pagar","Créditos"];
const DIAS=["dom","lun","mar","mié","jue","vie","sáb"];
function G(){ if(!S.guerra) S.guerra={fin:"2026-12-31",tope:1000,ajuste:0,esperados:[]}; if(!S.guerra.esperados) S.guerra.esperados=[]; return S.guerra; }
function cajaBase(){ const libre=S.ingresos.reduce((s,i)=>s+i.libre,0)-S.gastos.reduce((s,g)=>s+g.monto,0); return r2(libre+pendientes().reduce((s,p)=>s+p.apartado,0)); }
function caja(){ return r2(cajaBase()+(+G().ajuste||0)); }
function mondayOf(s){ const k=(new Date(parse(s)).getUTCDay()+6)%7; return addDays(s,-k); }
function ventasHoy(){ const h=todayStr(); return r2(S.ingresos.filter(i=>i.fecha===h&&i.monto>0&&!i.esperado).reduce((s,i)=>s+i.monto,0)); }
function personalSemana(w){ const e=addDays(w,6); return r2(S.gastos.filter(g=>g.fecha>=w&&g.fecha<=e&&!NO_PERSONAL.includes(catOf(g))).reduce((s,g)=>s+g.monto,0)); }
function guerraPlan(){
  const g=G(), hoy=todayStr(), fin=g.fin||"2026-12-31";
  const ev=[];
  pendientes().forEach(p=>{
    const rec=recOf(p); let f=p.vence, n=0;
    while(f<=fin && n++<120){
      if(p.hasta && f>p.hasta) break;
      ev.push({fecha:f<hoy?hoy:f, nombre:p.nombre, monto:p.monto, tipo:"out", tarde:f<hoy, pid:p.id});
      if(!rec) break; f=siguiente(f,rec);
    }
  });
  S.pagos.filter(p=>p.pagado&&(p.pagadoEn||"")>="2026-11-01"&&p.vence<=fin).forEach(p=>ev.push({fecha:p.vence<hoy?hoy:p.vence,nombre:p.nombre,monto:p.monto,tipo:"out",hecho:true}));
  g.esperados.forEach(e=>{ if(e.fecha<=fin) ev.push({fecha:e.fecha<hoy?hoy:e.fecha, nombre:e.nombre, monto:e.monto, tipo:"in", tarde:e.fecha<hoy, eid:e.id}); });
  for(let w=mondayOf(hoy); w<=fin; w=addDays(w,7)){
    const tope=+g.tope||0, rem=w<hoy?(7-days(w,hoy)):7;
    const left=r2(Math.min(tope-personalSemana(w), tope*rem/7));
    if(left>0) ev.push({fecha:w<hoy?hoy:w, nombre:"Reserva gasto personal", monto:left, tipo:"out", res:true});
  }
  ev.sort((a,b)=>a.fecha.localeCompare(b.fecha)||(a.tipo==="in"?-1:1));
  const byDate={}; ev.forEach(x=>{(byDate[x.fecha]=byDate[x.fecha]||[]).push(x);});
  const vh=ventasHoy(), c0=caja(), start=r2(c0-vh);
  const porPagar=r2(ev.filter(x=>x.tipo==="out"&&!x.res&&!x.hecho).reduce((s,x)=>s+x.monto,0));
  const vida=r2(ev.filter(x=>x.res).reduce((s,x)=>s+x.monto,0));
  const esperado=r2(ev.filter(x=>x.tipo==="in").reduce((s,x)=>s+x.monto,0));
  const diasRest=days(hoy,fin)+1;
  const faltante=r2(porPagar+vida-start-esperado);
  const meta=faltante>0?Math.ceil(faltante/diasRest):0;
  // caja día por día (sin ingresos extra) y alerta: primer día en que, aun juntando la meta diaria, no alcanza
  const bals={}; let bal=c0, balM=start, crit=null, critNeed=0;
  for(let d=hoy, i=0; d<=fin; d=addDays(d,1), i++){
    balM+=(i===0?Math.max(meta,vh):meta);
    (byDate[d]||[]).forEach(x=>{if(x.hecho)return;const v=x.tipo==="in"?x.monto:-x.monto; bal+=v; balM+=v;});
    bals[d]=r2(bal);
    if(!crit&&balM<-0.5){crit=d;critNeed=r2(-balM);}
  }
  // urgencia: lo que vence pronto, repartido en los días que faltan para esa fecha
  let urg=0, urgD=null, urgOut=0, urgIn=0, acc=start, accOut=0, accIn=0;
  for(let d=hoy; d<=fin; d=addDays(d,1)){
    (byDate[d]||[]).forEach(x=>{if(x.hecho)return; if(x.tipo==="in"){acc+=x.monto;accIn+=x.monto;} else {acc-=x.monto;accOut+=x.monto;}});
    if(acc<0){const r=-acc/(days(hoy,d)+1); if(r>urg+0.5){urg=r;urgD=d;urgOut=accOut;urgIn=accIn;}}
  }
  urg=Math.ceil(urg);
  const metaHoy=Math.max(meta,urg);
  return {ev, byDate, bals, meta, metaHoy, urg, urgD, urgOut:r2(urgOut), urgIn:r2(urgIn), crit, critNeed, caja:c0, start, vh, fin, final:bals[fin]??c0, porPagar, vida, esperado, faltante, diasRest};
}

async function flush(){
  if(writing){dirty=true;return;}

  catch(e){ if(e&&e.code==="invalid_argument"){dbRef=null;saveMode="local";render();} }

}
(async function connect(){

function setExtra(p,tasa,saldo){ if(tasa>0) p.tasa=r2(tasa); else delete p.tasa; if(saldo>0) p.saldo=r2(saldo); else delete p.saldo; }
function agregarPago(nombre,monto,vence,recurrente,hasta,tasa,saldo){
  const p={id:uid(),nombre,monto:r2(monto),vence,apartado:0,recurrente,pagado:false}; if(hasta) p.hasta=hasta; setExtra(p,tasa,saldo);
  S.pagos.push(p);
  save();render();toast("Pago agregado");
}
function editarPago(id,nombre,monto,vence,recurrente,hasta,tasa,saldo){
  const p=S.pagos.find(x=>x.id===id); if(!p) return; setExtra(p,tasa,saldo);
  p.nombre=nombre; p.monto=r2(monto); p.vence=vence; p.recurrente=recurrente; p.apartado=Math.min(p.apartado,p.monto);
  if(hasta) p.hasta=hasta; else delete p.hasta;
  save();render();toast("Pago actualizado. Plan recalculado");
}
function aplicarIngreso(monto,concepto,fecha,asig){
  let usado=0;
  Object.entries(asig).forEach(([id,a])=>{const p=S.pagos.find(x=>x.id===id);if(p&&a>0){const real=Math.min(a,restante(p));p.apartado=r2(p.apartado+real);asig[id]=r2(real);usado+=real;}else delete asig[id];});
  S.ingresos.push({id:uid(),fecha,monto:r2(monto),concepto,asig,libre:r2(monto-usado)});
  save();render();toast("Ingreso repartido");
}
function borrarIngreso(id){
  const ing=S.ingresos.find(i=>i.id===id);if(!ing)return;
  Object.entries(ing.asig||{}).forEach(([pid,a])=>{const p=S.pagos.find(x=>x.id===pid);if(p&&!p.pagado)p.apartado=r2(Math.max(0,p.apartado-a));});
  S.ingresos=S.ingresos.filter(i=>i.id!==id);save();render();toast("Ingreso eliminado y apartados devueltos");
}
function marcarPagado(id){
  const p=S.pagos.find(x=>x.id===id);if(!p)return;
  const falta=restante(p);

  if(falta>0){const g={id:uid(),fecha:todayStr(),monto:falta,cat:"Cuentas por pagar",concepto:"Complemento de "+p.nombre};S.gastos.push(g);p.compId=g.id;cubrirConApartados(g,p.nombre,p.id);}

function deshacerPago(id,silencioso){
  const p=S.pagos.find(x=>x.id===id);if(!p||!p.pagado)return;
  const rec=recOf(p);
  let sigP=p.sigId?S.pagos.find(x=>x.id===p.sigId):null;
  if(!sigP&&rec){const sv=siguiente(p.vence,rec);sigP=S.pagos.find(x=>x.id!==p.id&&!x.pagado&&x.nombre===p.nombre&&x.vence===sv&&!(x.apartado>0));}
  if(sigP&&!sigP.pagado) S.pagos=S.pagos.filter(x=>x.id!==sigP.id);
  if(p.compId){revertirAjuste(S.gastos.find(g=>g.id===p.compId));S.gastos=S.gastos.filter(g=>g.id!==p.compId);}
  p.pagado=false; p.apartado=p.compId||p.apartadoAntes!=null?(p.apartadoAntes||0):0;
  ["pagadoEn","sigId","compId","apartadoAntes"].forEach(k=>delete p[k]);
  if(!silencioso){save();render();toast("Pago regresado a pendiente");}
}

function cubrirConApartados(g,etiqueta,excluirId){
  const libre=r2(S.ingresos.reduce((s,i)=>s+i.libre,0)-S.gastos.reduce((s,x)=>s+x.monto,0));
  if(libre>=0) return null;
  let falta=-libre; const asig={}, nombres=[];
  pendientes().filter(p=>p.apartado>0&&p.id!==excluirId).sort((a,b)=>parse(b.vence)-parse(a.vence)).forEach(p=>{
    if(falta<=0) return; const t=r2(Math.min(p.apartado,falta)); p.apartado=r2(p.apartado-t); asig[p.id]=-t; falta=r2(falta-t); nombres.push(p.nombre);
  });
  const tomado=r2(-Object.values(asig).reduce((s,a)=>s+a,0));
  if(tomado<=0) return null;
  const ing={id:uid(),fecha:todayStr(),monto:0,concepto:"Tomado de apartados para: "+etiqueta,asig,libre:tomado,ajuste:true};
  S.ingresos.push(ing); g.ajusteId=ing.id;
  return {tomado,nombres};
}
function revertirAjuste(g){
  if(!g||!g.ajusteId) return;
  const ing=S.ingresos.find(i=>i.id===g.ajusteId);
  if(ing){Object.entries(ing.asig||{}).forEach(([pid,a])=>{const p=S.pagos.find(x=>x.id===pid);if(p&&!p.pagado)p.apartado=r2(Math.min(p.monto,p.apartado-a));});S.ingresos=S.ingresos.filter(i=>i.id!==ing.id);}
}
function agregarGasto(monto,concepto,cat){
  S.config.ultimaCat=cat;
  const g={id:uid(),fecha:todayStr(),monto:r2(monto),cat,concepto}; S.gastos.push(g);
  const r=cubrirConApartados(g,concepto||cat);
  save();render();toast(r?"No tenías dinero libre: tomé "+money(r.tomado)+" de lo apartado para "+r.nombres.join(", "):"Gasto registrado");
}

function apartarLibre(){
  const m=metricas();let disp=r2(Math.min(m.libre,m.falta));if(disp<=0)return;
  const asig={};
  pendientes().filter(p=>restante(p)>0).sort((a,b)=>parse(a.vence)-parse(b.vence)).forEach(p=>{if(disp<=0)return;const a=r2(Math.min(restante(p),disp));p.apartado=r2(p.apartado+a);asig[p.id]=a;disp=r2(disp-a);});
  const usado=r2(Object.values(asig).reduce((s,a)=>s+a,0));
  S.ingresos.push({id:uid(),fecha:todayStr(),monto:0,concepto:"Dinero libre enviado a pagos",asig,libre:-usado});
  save();render();toast("Aparté "+money(usado)+" de tu dinero libre");
}

function ordenes(P){
  const hoy=todayStr(), o=[];
  if(P.urg>P.meta) o.push('Hasta el <b>'+fdate(P.urgD)+'</b> junta <b>'+money(P.urg)+'</b> al día para cubrir lo que vence. Después baja a <b>'+money(P.meta)+'</b> diarios.');
  else if(P.meta>0) o.push('Junta <b>'+money(P.meta)+'</b> al día entre ventas, negocios e inversiones y llegas al '+fdate(P.fin)+' con todo pagado.');
  else o.push('Con lo que tienes y lo que esperas, te alcanza para todo hasta el '+fdate(P.fin)+'. Lo extra úsalo para adelantar la deuda más cara.');
  if(P.crit&&P.crit===todayStr()) o.push('<b>Hoy tu caja queda en '+money(-P.critNeed)+'</b>: registraste pagos o gastos por más dinero del que tienes. Registra el ingreso con el que pagaste o ajusta tu caja.');
  else if(false&&P.crit) o.push('<b>Ojo con el '+fdate(P.crit)+'</b>: ese día salen pagos antes de que llegue tu dinero esperado. Aunque juntes la meta, te faltarían <b>'+money(P.critNeed)+'</b>. Junta extra antes, mueve la fecha o usa un puente.');
  const sem=P.ev.filter(x=>x.tipo==="out"&&!x.res&&!x.hecho&&x.fecha<=addDays(hoy,7));

async function pedirEstrategia(){
  if(!sampleFn) return;
  const P=guerraPlan(), hoy=todayStr(), box=document.getElementById("ai-out");
  if(box){box.hidden=false;box.textContent="Analizando tu tablero…";}
  const fut=P.ev.filter(x=>!x.res&&!x.hecho).slice(0,45).map(x=>x.fecha+" | "+(x.tipo==="in"?"entra":"sale")+" | "+x.nombre+" | "+Math.round(x.monto)).join("\n");
  const prompt="Eres la asesora financiera estratégica de Rodolfo, dueño de MATRU Cacao (Tabasco, México). Plan de guerra hasta el "+P.fin+". Hoy es "+hoy+".\n"+
    "Caja hoy "+Math.round(P.caja)+"; meta de ingreso hoy "+P.metaHoy+"; promedio diario "+P.meta+"; punto crítico "+(P.crit||"ninguno")+"; caja proyectada al cierre "+Math.round(P.final)+"; ingresado hoy "+Math.round(P.vh)+"; gasto personal esta semana "+Math.round(personalSemana(mondayOf(hoy)))+" de tope "+(G().tope||0)+".\n"+
    "Próximos movimientos (fecha | tipo | concepto | monto):\n"+fut+"\n"+
    "Reglas fijas: débitos automáticos (BBVA, créditos) y tandas nunca fallan; aguinaldo apartado para Edel; César pasa a enero; no recomendar apostar dinero destinado a pagos; el oro solo como puente de emergencia de pocos días.\n"+
    "Responde en español mexicano casual, máximo 6 líneas cortas: 1) qué hacer HOY, 2) qué cuidar esta semana, 3) un movimiento táctico concreto. Sin introducción.";
  try{ const r=await sampleFn(prompt,{cache:false,onText:u=>{const b=document.getElementById("ai-out");if(b)b.textContent=u.text;}}); aiText=r.text; }
  catch(e){ aiText=e&&e.code==="rate_limited"?"Muchas consultas seguidas. Espera un momento.":"No pude consultar ahora. Sigue las órdenes de arriba."; }
  const b=document.getElementById("ai-out"); if(b){b.hidden=false;b.textContent=aiText;}
}

function renderPreview(){
  const box=document.getElementById("pv");if(!box||!preview)return;
  const {monto,r}=preview;
  if(!r.pend.length){box.innerHTML='<div class="note ok">No tienes pagos pendientes: todo este ingreso queda libre.</div><button class="btn" data-act="aplicar" style="width:100%;margin-top:12px">Guardar ingreso</button>';return;}
  const usado=r2(Object.values(preview.asig).reduce((s,a)=>s+(+a||0),0));
  const libre=r2(monto-usado);
  const row=x=>'<div class="pv-row"><div><b>'+esc(x.p.nombre)+'</b><span class="item-sub">'+venceTxt(x.p)+' · faltan '+money(restante(x.p))+'</span></div><input type="number" step="0.01" min="0" id="pv-'+x.p.id+'" data-pv="'+x.p.id+'" value="'+(preview.asig[x.p.id]||0)+'" aria-label="Apartar para '+esc(x.p.nombre)+'"></div>';
  const con=r.pend.filter(x=>(+preview.asig[x.p.id]||0)>0), sin=r.pend.filter(x=>!((+preview.asig[x.p.id]||0)>0));
  const f=document.getElementById("f-ing"); if(f) f.hidden=true;
  box.innerHTML='<div class="pv">'+
    '<div class="pv-total" style="border:0;padding:0"><span>Ingreso de '+money(monto)+(preview.concepto?' · '+esc(preview.concepto):'')+'</span><button class="btn sm ghost" type="button" data-act="reeditar">Cambiar</button></div>'+
    '<button class="btn" data-act="aplicar"'+(libre<0?" disabled":"")+'>Aplicar reparto</button>'+
    '<div class="pv-total"><span>Te queda libre</span><span class="num" style="color:'+(libre<0?"var(--bad)":"var(--ok)")+'">'+money(libre)+'</span></div>'+
    (libre<0?'<div class="note bad">Estás apartando más de lo que entró. Ajusta los montos.</div>':'')+
    '<span class="eyebrow">Así lo reparto</span>'+
    con.map(row).join("")+
    (sin.length?'<details><summary class="item-sub" style="cursor:pointer;padding:6px 0">Ver los demás pagos ('+sin.length+')</summary><div class="pv" style="margin-top:8px">'+sin.map(row).join("")+'</div></details>':'')+
    (r.falta>0?'<div class="note bad">Para ir al día con todos tus pagos necesitabas '+money(r.necesario)+'. Faltan '+money(r.falta)+'; tus siguientes ingresos tendrán que apartar más.</div>':'<div class="note ok">Cubres tu meta de '+money(r.necesario)+' y te sobran '+money(r2(monto-r.necesario))+'.</div>')+
    '<span class="item-sub">Puedes cambiar cualquier monto antes de aplicar.</span></div>';
  const sh=document.querySelector(".sheet"); if(sh) sh.scrollTop=0;
}
function parseMonto(v){const s=String(v||"").replace(/[$\s]/g,"");const t=/,\d{1,2}$/.test(s)&&!s.includes(".")?s.replace(/\./g,"").replace(",","."):s.replace(/,/g,"");return r2(parseFloat(t));}
function confirmSheet(msg,label,fn){
  sheet("¿Seguro?",'<p style="margin:0">'+esc(msg)+'</p><div class="actions"><button class="btn danger" id="ok-btn">'+esc(label)+'</button><button class="btn ghost" data-close="1">Cancelar</button></div>');

}

/* ---------- eventos ---------- */
document.addEventListener("click",e=>{
  const sb=e.target.closest('button[type="submit"]');
  if(sb&&sb.form){e.preventDefault();if(sb.form.reportValidity&&!sb.form.reportValidity())return;handleSubmit(sb.form);return;}
  const c=e.target.closest("[data-close]");
  if(c&&(c.classList.contains("x")||e.target===c||c.tagName==="BUTTON")){closeSheet();return;}
  const t=e.target.closest(".tab");if(t){tab=t.dataset.tab;render();window.scrollTo(0,0);return;}
  const a=e.target.closest("[data-act]");if(!a)return;
  const id=a.dataset.id;
  switch(a.dataset.act){
    case "pago":sheetPago();break;
    case "editpago":{const p=S.pagos.find(x=>x.id===id);if(p)sheetPago(p);break;}
    case "venta":sheetIngreso();break;
    case "llego":{const e=G().esperados.find(x=>x.id===id);if(!e)break;sheetIngreso();
      document.getElementById("i-monto").value=e.monto;document.getElementById("i-con").value=e.nombre;pendingEsp=e.id;break;}
    case "espadd":sheetEsperado();break;
    case "espedit":{const e=G().esperados.find(x=>x.id===id);if(e)sheetEsperado(e);break;}
    case "espdel":{const e=G().esperados.find(x=>x.id===id);if(e)confirmSheet("Se quitará \""+e.nombre+"\" de "+money(e.monto)+" del plan.","Eliminar",()=>{G().esperados=G().esperados.filter(x=>x.id!==id);save();render();toast("Eliminado. Plan recalculado");});break;}
    case "caja":sheetCaja();break;
    case "deshacer":deshacerPago(id);document.getElementById("toast-root").innerHTML="";break;
    case "pvista":pagosVista=a.dataset.v;render();break;
    case "laborden":labOrden=a.dataset.v;render();break;
    case "labmas":labExtra=+a.dataset.v?r2((+labExtra||0)+(+a.dataset.v)):0;render();break;
    case "reiniciar":confirmSheet("Todos tus pagos del plan vuelven a pendientes en su fecha (también los que eliminaste) y se borran tus ingresos y gastos. El dinero que esperas se queda.","Reiniciar prueba",reiniciarPrueba);break;
    case "reeditar":{const f=document.getElementById("f-ing");if(f)f.hidden=false;const pv=document.getElementById("pv");if(pv)pv.innerHTML="";preview=null;const m=document.getElementById("i-monto");if(m)m.focus();break;}
    case "estrategia":pedirEstrategia();break;
    case "gasto":sheetGasto();break;
    case "ingreso":sheetIngreso();break;
    case "ejemplo":cargarEjemplo();break;
    case "go-pagos":tab="pagos";render();window.scrollTo(0,0);break;
    case "pagar":{const p=S.pagos.find(x=>x.id===id);const f=restante(p);
      if(f>0)confirmSheet("A "+p.nombre+" le faltan "+money(f)+" por apartar. Si lo marcas pagado, esa diferencia se descuenta de tu dinero libre.","Marcar pagado",()=>marcarPagado(id));else marcarPagado(id);break;}
    case "delpago":{const p=S.pagos.find(x=>x.id===id);confirmSheet("Se eliminará "+p.nombre+" y lo apartado para él dejará de contarse.","Eliminar pago",()=>borrarPago(id));break;}
    case "gastos":sheetGastos();break;
    case "exportar":exportar();break;
    case "importar":sheetImportar();break;
    case "doimport":{const t=document.getElementById("imp-txt");let d=null;try{d=JSON.parse(t.value.trim());}catch(err){}
      if(!d||!Array.isArray(d.pagos)||!Array.isArray(d.ingresos)||!Array.isArray(d.gastos)){document.getElementById("imp-err").hidden=false;break;}
      S=Object.assign(blank(),d);S.ejemplo=false;save();closeSheet();render();toast("Datos importados");break;}
    case "go-gastos":tab="gastos";render();window.scrollTo(0,0);break;
    case "per":per=a.dataset.v;render();break;
    case "apartarlibre":apartarLibre();break;
    case "delgasto":{const g=S.gastos.find(x=>x.id===id);if(g)confirmSheet("Se eliminará el gasto \""+(g.concepto||"Gasto")+"\" de "+money(g.monto)+" y ese dinero vuelve a tu saldo libre.","Eliminar gasto",()=>borrarGasto(id));break;}
    case "deling":confirmSheet("Se eliminará este ingreso y se devolverá lo que apartó a cada pago.","Eliminar ingreso",()=>borrarIngreso(id));break;
    case "reset":confirmSheet("Se borrarán todos tus pagos, ingresos y gastos.","Borrar todo",borrarTodo);break;
    case "aplicar":if(preview){const asig={};Object.entries(preview.asig).forEach(([k,v])=>{if(+v>0)asig[k]=r2(+v);});
      if(pendingEsp){const eid=pendingEsp;pendingEsp=null;G().esperados=G().esperados.filter(x=>x.id!==eid);aplicarIngreso(preview.monto,preview.concepto,preview.fecha,asig);S.ingresos[S.ingresos.length-1].esperado=true;save();}
      else aplicarIngreso(preview.monto,preview.concepto,preview.fecha,asig);
      closeSheet();preview=null;}break;
  }
});
document.addEventListener("submit",e=>{e.preventDefault();handleSubmit(e.target);});
document.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&e.target.tagName==="INPUT"&&e.target.form&&!e.target.closest(".pv")){e.preventDefault();if(e.target.form.reportValidity&&!e.target.form.reportValidity())return;handleSubmit(e.target.form);}
});
function handleSubmit(f){
  if(f.id==="f-pago"){const a=[f.querySelector("#p-nombre").value.trim(),+f.querySelector("#p-monto").value,f.querySelector("#p-vence").value,f.querySelector("#p-rec").value,f.querySelector("#p-hasta").value,parseMonto(f.querySelector("#p-tasa").value)||0,parseMonto(f.querySelector("#p-saldo").value)||0];
    if(f.dataset.id) editarPago(f.dataset.id,...a); else agregarPago(...a); closeSheet();}
  else if(f.id==="f-esp"){const d={nombre:f.querySelector("#e-nombre").value.trim()||"Ingreso",monto:r2(+f.querySelector("#e-monto").value),fecha:f.querySelector("#e-fecha").value};
    if(f.dataset.id){const e=G().esperados.find(x=>x.id===f.dataset.id);if(e)Object.assign(e,d);}else G().esperados.push(Object.assign({id:uid()},d));
    save();closeSheet();render();toast("Guardado. Plan recalculado");}
  else if(f.id==="f-caja"){G().ajuste=r2(+f.querySelector("#c-monto").value-cajaBase());save();closeSheet();render();toast("Caja actualizada");}
  else if(f.id==="f-gasto"){const gm=parseMonto(f.querySelector("#g-monto").value);if(!(gm>0)){toast("Escribe el monto solo con números, por ejemplo 250");return;}agregarGasto(gm,f.querySelector("#g-con").value.trim(),f.querySelector("#g-cat").value);closeSheet();}
  else if(f.id==="f-ing"){
    const monto=parseMonto(f.querySelector("#i-monto").value);const fecha=f.querySelector("#i-fecha").value||todayStr();
    if(!(monto>0)){toast("Escribe el monto solo con números, por ejemplo 5000");return;}
    if(document.activeElement)document.activeElement.blur();
    const r=repartir(monto,fecha);
    preview={monto,fecha,concepto:f.querySelector("#i-con").value.trim(),r,asig:Object.assign({},r.asig)};
    renderPreview();
  }
}
document.addEventListener("input",e=>{
  if(e.target.dataset.pv&&preview){preview.asig[e.target.dataset.pv]=+e.target.value||0;
    const usado=r2(Object.values(preview.asig).reduce((s,a)=>s+(+a||0),0));const libre=r2(preview.monto-usado);
    const tot=document.querySelector(".pv-total .num");if(tot){tot.textContent=money(libre);tot.style.color=libre<0?"var(--bad)":"var(--ok)";}
    const btn=document.querySelector('[data-act="aplicar"]');if(btn)btn.disabled=libre<0;}
});
document.addEventListener("change",e=>{
  if(e.target.id==="cfg-frec"){S.config.frecuencia=e.target.value;save();render();toast("Frecuencia actualizada");}
  if(e.target.id==="cfg-estricto"){S.config.estricto=e.target.value==="si";save();render();toast("Forma de apartar actualizada");}
  if(e.target.id==="cfg-negocio"){fuentes().negocio=e.target.checked;save();render();toast("Ingresos actualizados");}
  if(e.target.id==="cfg-sueldo"){const f=fuentes();if(e.target.value){f.sueldo={frecuencia:e.target.value,proxima:(f.sueldo&&f.sueldo.proxima)||addDays(todayStr(),SUELDO_FREQ[e.target.value])};}else f.sueldo=null;save();render();toast("Sueldo actualizado");}
  if(e.target.id==="cfg-sprox"&&e.target.value){fuentes().sueldo.proxima=e.target.value;save();render();toast("Fecha del sueldo actualizada");}
  if(e.target.id==="cfg-rinde"){S.config.rinde=+e.target.value;save();render();toast("Colchón actualizado");}
  if(e.target.id==="lab-extra"){labExtra=Math.max(0,parseMonto(e.target.value)||0);render();}
  if(e.target.id==="cfg-gfin"&&e.target.value){G().fin=e.target.value;save();render();toast("Plan recalculado");}
  if(e.target.id==="cfg-gtope"){G().tope=Math.max(0,+e.target.value||0);save();render();toast("Tope actualizado");}
  if(e.target.id==="cfg-modo"){S.config.modo=e.target.value;save();render();toast("Modo de reparto actualizado");}
});
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();});

render();
(async function(){ try{ if(window.claude&&window.claude.use){ const s=await claude.use("sample"); if(s){sampleFn=s; if(tab==="inicio") render();} } }catch(e){} })();
})();
</script>
